
name: Publish site

run-name: "Yayınla ${{ inputs.publish_id || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      publish_id:
        description: Publish job ID
        required: false
        default: ""

  push:
    branches: [main]
    paths:
      - "client/**"
      - "deploy/remote-site.sh"
      - ".github/workflows/publish-site.yml"

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'push' || vars.AUTO_DEPLOY_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      API_URL: ${{ vars.API_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLISH_ID: ${{ inputs.publish_id }}
      PUBLISH_CALLBACK_TOKEN: ${{ secrets.PUBLISH_CALLBACK_TOKEN }}
      DEPLOY_METHOD: ${{ vars.DEPLOY_METHOD || 'ftps' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '.' }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check configuration
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_API_TOKEN }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""

          [ -n "$API_URL" ] || missing="$missing API_URL"
          [ -n "$SITE_URL" ] || missing="$missing SITE_URL"
          [ -n "$CONTENT_TOKEN" ] || missing="$missing CONTENT_API_TOKEN"

          if [ "$DEPLOY_METHOD" = "ssh" ]; then
            [ -n "$SSH_HOST" ] || missing="$missing DEPLOY_HOST"
            [ -n "$SSH_USER" ] || missing="$missing DEPLOY_USER"
            [ -n "$SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
            [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"

          elif [ "$DEPLOY_METHOD" = "ftps" ]; then
            [ -n "$FTP_HOST" ] || missing="$missing FTP_HOST"
            [ -n "$FTP_USER" ] || missing="$missing FTP_USER"
            [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"

          else
            missing="$missing DEPLOY_METHOD"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing configuration:$missing"
            exit 1
          fi

          echo "Configuration OK"
          echo "Deploy method: $DEPLOY_METHOD"

      - name: Report start
        run: node .github/scripts/report.mjs build_started

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build website
        id: build
        working-directory: client
        env:
          NODE_ENV: production
          CONTENT_API_URL: ${{ vars.API_URL }}/content
          CONTENT_API_TOKEN: ${{ secrets.CONTENT_API_TOKEN }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_GSC_VERIFICATION: ${{ vars.VITE_GSC_VERIFICATION }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../build.log

      - name: Verify build
        id: verify
        working-directory: client/dist
        run: |
          set -e

          for file in index.html build.json sitemap.xml robots.txt .htaccess; do
            test -s "$file" || {
              echo "::error::$file missing"
              exit 1
            }
          done

          pages=$(find tr en ar -name index.html | wc -l)
          min=${{ vars.MIN_PAGES || 100 }}

          echo "Prerendered pages: $pages"

          if [ "$pages" -lt "$min" ]; then
            echo "::error::Not enough prerendered pages"
            exit 1
          fi

          grep -q "<loc>$SITE_URL/tr</loc>" sitemap.xml

          grep -q '"run": "${{ github.run_id }}"' build.json

          du -sh .

          echo "Build verification successful"

      - name: Report build
        run: node .github/scripts/report.mjs build_succeeded

      - name: Package release
        run: |
          tar -czf "release-$RELEASE_ID.tar.gz" -C client/dist .

      # SSH deployment (optional)
      - name: Deploy over SSH
        id: deploy_ssh
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes"

          $SSH "$USER_NAME@$HOST" \
            'mkdir -p ~/rma-deploy/incoming'

          scp \
            -i ~/.ssh/deploy_key \
            -P "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "release-$RELEASE_ID.tar.gz" \
            "$USER_NAME@$HOST:rma-deploy/incoming/"

          $SSH "$USER_NAME@$HOST" \
            "bash -s -- deploy '$RELEASE_ID' \"\$HOME/rma-deploy/incoming/release-$RELEASE_ID.tar.gz\" '$DEPLOY_PATH' 5" \
            < deploy/remote-site.sh

      # FTPS deployment for hosting.com.tr
      
      # FTPS deployment for hosting.com.tr
      - name: Deploy over FTPS
        id: deploy_ftps
        if: env.DEPLOY_METHOD == 'ftps'
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"

          echo "77.245.159.39 codex.wlsrv.com" | sudo tee -a /etc/hosts >/dev/null

          CREDENTIALS_FILE="$(mktemp)"
          chmod 600 "$CREDENTIALS_FILE"
          trap 'rm -f "$CREDENTIALS_FILE"' EXIT

          printf 'user "%s" "%s"\n' \
            "$FTP_USER" "$FTP_PASSWORD" > "$CREDENTIALS_FILE"

          echo "Connecting to FTPS..."

          lftp -e "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set ftp:passive-mode true
            set net:max-retries 2
            set net:timeout 30
            open ftp://codex.wlsrv.com
            source $CREDENTIALS_FILE
            cls
            cd \"$DEPLOY_PATH\"
            mirror -R --parallel=4 --verbose=1 \
              --exclude-glob api/ \
              --exclude-glob uploads/ \
              --exclude-glob .well-known/ \
              --exclude-glob cgi-bin/ \
              client/dist .
            bye
          "

          echo "FTPS upload completed"


          echo "FTPS upload completed"

      - name: Verify live site
        id: live
        run: |
          set -e

          for attempt in 1 2 3 4 5 6; do

            run=$(
              curl -fsS --max-time 15 \
                "$SITE_URL/build.json?ts=$(date +%s)" \
                | node -e "
                  let s = '';
                  process.stdin.on('data', d => s += d);
                  process.stdin.on('end', () => {
                    try {
                      console.log(JSON.parse(s).run);
                    } catch {
                      console.log('');
                    }
                  });
                " || true
            )

            if [ "$run" = "${{ github.run_id }}" ]; then

              curl -fsS --max-time 15 \
                -o /dev/null "$SITE_URL/tr/"

              curl -fsS --max-time 15 \
                -o /dev/null "$SITE_URL/en/products"

              echo "Live site verified successfully"
              exit 0
            fi

            echo "Waiting for live deployment ($attempt/6)"
            sleep 10

          done

          echo "::error::Live site does not serve the new build"
          exit 1

      - name: Report success
        run: node .github/scripts/report.mjs deploy_succeeded

      - name: Report failure
        if: failure()
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ] || \
             [ "${{ steps.verify.outcome }}" = "failure" ]; then

            node .github/scripts/report.mjs \
              build_failed \
              "Derleme ya da derleme kontrolü başarısız."

          elif [ "${{ steps.live.outcome }}" = "failure" ]; then

            node .github/scripts/report.mjs \
              deploy_failed \
              "Dosyalar yüklendi ancak canlı site yeni sürümü göstermiyor."

          elif [ "${{ steps.deploy_ssh.outcome }}" = "failure" ] || \
               [ "${{ steps.deploy_ftps.outcome }}" = "failure" ]; then

            node .github/scripts/report.mjs \
              deploy_failed \
              "Sunucuya yükleme başarısız; eski site yayında."

          else

            node .github/scripts/report.mjs \
              build_failed \
              "Yayınlama hazırlığı başarısız."

          fi

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
