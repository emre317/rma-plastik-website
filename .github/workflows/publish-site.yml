
name: Publish site

run-name: "Yayınla ${{ inputs.publish_id || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      publish_id:
        description: Publish job ID
        required: false
        default: ""

  push:
    branches: [main]
    paths:
      - "client/**"
      - "deploy/remote-site.sh"
      - ".github/workflows/publish-site.yml"

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'push' || vars.AUTO_DEPLOY_ON_PUSH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production

    env:
      API_URL: ${{ vars.API_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLISH_ID: ${{ inputs.publish_id }}
      PUBLISH_CALLBACK_TOKEN: ${{ secrets.PUBLISH_CALLBACK_TOKEN }}
      DEPLOY_METHOD: ${{ vars.DEPLOY_METHOD || 'ftps' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '.' }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check configuration
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_API_TOKEN }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""

          [ -n "$API_URL" ] || missing="$missing API_URL"
          [ -n "$SITE_URL" ] || missing="$missing SITE_URL"
          [ -n "$CONTENT_TOKEN" ] || missing="$missing CONTENT_API_TOKEN"

          if [ "$DEPLOY_METHOD" = "ssh" ]; then
            [ -n "$SSH_HOST" ] || missing="$missing DEPLOY_HOST"
            [ -n "$SSH_USER" ] || missing="$missing DEPLOY_USER"
            [ -n "$SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
            [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          elif [ "$DEPLOY_METHOD" = "ftps" ]; then
            [ -n "$FTP_HOST" ] || missing="$missing FTP_HOST"
            [ -n "$FTP_USER" ] || missing="$missing FTP_USER"
            [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          else
            missing="$missing DEPLOY_METHOD"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing configuration:$missing"
            exit 1
          fi

          echo "Configuration OK"
          echo "Deploy method: $DEPLOY_METHOD"

      - name: Report start
        run: node .github/scripts/report.mjs build_started

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci --include=dev --no-audit --no-fund

      - name: Diagnose content API
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_API_TOKEN }}
        run: |
          set -euo pipefail

          curl -fsS -L \
            --max-time 20 \
            -o /dev/null \
            -w 'Content API HTTP: %{http_code}\n' \
            -H "Authorization: Bearer $CONTENT_TOKEN" \
            "$API_URL/content"

      - name: Build website
        id: build
        working-directory: client
        env:
          NODE_ENV: production
          CONTENT_API_URL: ${{ vars.API_URL }}/content
          CONTENT_API_TOKEN: ${{ secrets.CONTENT_API_TOKEN }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_GSC_VERIFICATION: ${{ vars.VITE_GSC_VERIFICATION }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../build.log

      - name: Verify build
        id: verify
        working-directory: client/dist
        run: |
          set -euo pipefail

          for file in index.html build.json sitemap.xml robots.txt .htaccess; do
            test -s "$file" || {
              echo "::error::$file missing"
              exit 1
            }
          done

          pages=$(find tr en ar -name index.html | wc -l)
          min=${{ vars.MIN_PAGES || 100 }}

          echo "Prerendered pages: $pages"

          if [ "$pages" -lt "$min" ]; then
            echo "::error::Not enough prerendered pages"
            exit 1
          fi

          grep -q "<loc>$SITE_URL/tr</loc>" sitemap.xml
          grep -q '"run": "${{ github.run_id }}"' build.json

          du -sh .
          echo "Build verification successful"

      - name: Report build
        run: node .github/scripts/report.mjs build_succeeded

      - name: Package release
        if: env.DEPLOY_METHOD == 'ssh'
        run: |
          tar -czf "release-$RELEASE_ID.tar.gz" -C client/dist .

      - name: Deploy over SSH
        id: deploy_ssh
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"

          $SSH "$USER_NAME@$HOST" \
            'mkdir -p ~/rma-deploy/incoming'

          scp \
            -i ~/.ssh/deploy_key \
            -P "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "release-$RELEASE_ID.tar.gz" \
            "$USER_NAME@$HOST:rma-deploy/incoming/"

          $SSH "$USER_NAME@$HOST" \
            "bash -s -- deploy '$RELEASE_ID' \"\$HOME/rma-deploy/incoming/release-$RELEASE_ID.tar.gz\" '$DEPLOY_PATH' 5" \
            < deploy/remote-site.sh

      - name: Deploy over FTPS
        id: deploy_ftps
        if: env.DEPLOY_METHOD == 'ftps'
        timeout-minutes: 15
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_CONNECT_IP: ${{ vars.FTP_CONNECT_IP || '77.245.159.39' }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/rma-ftps"
          cd "$RUNNER_TEMP/rma-ftps"

          npm install \
            --no-save \
            --no-package-lock \
            --no-audit \
            --no-fund \
            basic-ftp@5.2.1

          cd "$GITHUB_WORKSPACE"

          node <<'EOF'
          const ftp = require(
            process.env.RUNNER_TEMP +
            '/rma-ftps/node_modules/basic-ftp'
          );

          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const LOCAL_ROOT = path.resolve('client/dist');
          const REMOTE_ROOT = process.env.DEPLOY_PATH || '.';
          const MANIFEST = '.rma-deploy-manifest.json';
          const WORKERS = 4;
          const TIMEOUT = 20000;
          const MAX_ATTEMPTS = 3;

          const protectedNames = new Set([
            'api',
            'uploads',
            '.well-known',
            'cgi-bin',
            MANIFEST
          ]);

          const sleep = ms =>
            new Promise(resolve => setTimeout(resolve, ms));

          function hashFile(file) {
            return crypto
              .createHash('sha256')
              .update(fs.readFileSync(file))
              .digest('hex');
          }

          function collectFiles(dir = LOCAL_ROOT, prefix = '') {
            const result = [];

            for (const entry of fs.readdirSync(dir, {
              withFileTypes: true
            })) {
              if (!prefix && protectedNames.has(entry.name)) {
                console.log('Protected:', entry.name);
                continue;
              }

              if (entry.isSymbolicLink()) {
                throw new Error(
                  `Symbolic link not allowed: ${entry.name}`
                );
              }

              const absolute = path.join(dir, entry.name);
              const relative = prefix
                ? `${prefix}/${entry.name}`
                : entry.name;

              if (entry.isDirectory()) {
                result.push(...collectFiles(absolute, relative));
              } else if (entry.isFile()) {
                result.push({
                  absolute,
                  relative,
                  hash: hashFile(absolute),
                  size: fs.statSync(absolute).size
                });
              }
            }

            return result;
          }

          function createClient() {
            const client = new ftp.Client(TIMEOUT);
            client.ftp.verbose = false;
            return client;
          }

          async function connect(client) {
            await client.access({
              host: process.env.FTP_CONNECT_IP,
              port: Number(process.env.FTP_PORT || 21),
              user: process.env.FTP_USER,
              password: process.env.FTP_PASSWORD,
              secure: true,
              secureOptions: {
                servername: process.env.FTP_HOST,
                rejectUnauthorized: true,
                minVersion: 'TLSv1.2'
              }
            });

            await client.cd(REMOTE_ROOT);
            return client.pwd();
          }

          async function readManifest(client, root) {
            const temp = path.join(
              os.tmpdir(),
              `rma-manifest-${process.pid}.json`
            );

            try {
              await client.downloadTo(
                temp,
                path.posix.join(root, MANIFEST)
              );

              const data = JSON.parse(
                fs.readFileSync(temp, 'utf8')
              );

              if (
                data.version !== 1 ||
                typeof data.files !== 'object' ||
                data.files === null ||
                Array.isArray(data.files)
              ) {
                throw new Error('Invalid manifest structure');
              }

              return data.files;
            } catch (error) {
              console.log(
                'Previous manifest unavailable:',
                error.message
              );
              return {};
            } finally {
              fs.rmSync(temp, { force: true });
            }
          }

          async function uploadOne(client, root, file) {
            const destination = path.posix.join(
              root,
              file.relative
            );

            const parent = path.posix.dirname(destination);

            await client.ensureDir(parent);

            await client.uploadFrom(
              file.absolute,
              destination
            );
          }

          async function worker(queue, root, number, results) {
            let client = null;

            try {
              for (;;) {
                const file = queue.shift();
                if (!file) break;

                let uploaded = false;
                let lastError;

                for (
                  let attempt = 1;
                  attempt <= MAX_ATTEMPTS;
                  attempt++
                ) {
                  try {
                    if (!client) {
                      client = createClient();
                      await connect(client);
                    }

                    console.log(
                      `[Worker ${number}] Uploading: ${file.relative} (${file.size} bytes)`
                    );

                    await uploadOne(client, root, file);

                    results.push(file.relative);
                    uploaded = true;

                    console.log(
                      `[Worker ${number}] OK: ${file.relative}`
                    );

                    break;
                  } catch (error) {
                    lastError = error;

                    console.error(
                      `[Worker ${number}] Attempt ${attempt}/${MAX_ATTEMPTS} failed: ${file.relative}: ${error.message}`
                    );

                    if (client) client.close();
                    client = null;

                    if (attempt < MAX_ATTEMPTS) {
                      await sleep(attempt * 1000);
                    }
                  }
                }

                if (!uploaded) {
                  throw new Error(
                    `Upload failed: ${file.relative}: ${lastError?.message}`
                  );
                }
              }
            } finally {
              if (client) client.close();
            }
          }

          async function main() {
            for (const key of [
              'FTP_HOST',
              'FTP_USER',
              'FTP_PASSWORD',
              'FTP_CONNECT_IP'
            ]) {
              if (!process.env[key]) {
                throw new Error(`Missing ${key}`);
              }
            }

            if (!fs.existsSync(LOCAL_ROOT)) {
              throw new Error('Build directory missing');
            }

            const allFiles = collectFiles();

            const current = Object.fromEntries(
              allFiles.map(file => [file.relative, file.hash])
            );

            console.log('Build files:', allFiles.length);

            const client = createClient();
            let root;
            let previous;

            try {
              root = await connect(client);
              console.log('FTPS connected. Remote:', root);
              previous = await readManifest(client, root);
            } finally {
              client.close();
            }

            const changed = allFiles.filter(
              file => previous[file.relative] !== file.hash
            );

            const buildFile = changed.find(
              file => file.relative === 'build.json'
            );

            const queue = changed.filter(
              file => file.relative !== 'build.json'
            );

            const unchanged = allFiles.length - changed.length;

            console.log('Unchanged files:', unchanged);
            console.log('Files to upload:', changed.length);

            const results = [];

            const workers = Array.from(
              { length: Math.min(WORKERS, queue.length) },
              (_, i) => worker(queue, root, i + 1, results)
            );

            await Promise.all(workers);

            const finalClient = createClient();

            try {
              await connect(finalClient);

              if (buildFile) {
                console.log('Uploading build.json last...');
                await uploadOne(finalClient, root, buildFile);
                results.push('build.json');
              }

              const manifestPath = path.join(
                os.tmpdir(),
                `rma-new-manifest-${process.pid}.json`
              );

              try {
                fs.writeFileSync(
                  manifestPath,
                  JSON.stringify({
                    version: 1,
                    release: process.env.RELEASE_ID,
                    createdAt: new Date().toISOString(),
                    files: current
                  })
                );

                await finalClient.uploadFrom(
                  manifestPath,
                  path.posix.join(root, MANIFEST)
                );
              } finally {
                fs.rmSync(manifestPath, { force: true });
              }
            } finally {
              finalClient.close();
            }

            console.log(
              `Deployment complete. Uploaded ${results.length} files.`
            );
          }

          main().catch(error => {
            console.error('FTPS DEPLOYMENT FAILED:', error);
            process.exitCode = 1;
          });
          EOF

      - name: Verify live site
        id: live
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6; do
            run=$(
              curl -fsS --max-time 15 \
                "$SITE_URL/build.json?ts=$(date +%s)" \
                | node -e "
                  let s = '';
                  process.stdin.on('data', d => s += d);
                  process.stdin.on('end', () => {
                    try {
                      console.log(JSON.parse(s).run);
                    } catch {
                      console.log('');
                    }
                  });
                " || true
            )

            if [ "$run" = "${{ github.run_id }}" ]; then
              curl -fsS --max-time 15 \
                -o /dev/null "$SITE_URL/tr/"

              curl -fsS --max-time 15 \
                -o /dev/null "$SITE_URL/en/products"

              echo "Live site verified successfully"
              exit 0
            fi

            echo "Waiting for live deployment ($attempt/6)"
            sleep 10
          done

          echo "::error::Live site does not serve the new build"
          exit 1

      - name: Report success
        run: node .github/scripts/report.mjs deploy_succeeded

      - name: Report failure
        if: failure()
        run: |
          if [ "${{ steps.build.outcome }}" = "failure" ] || \
             [ "${{ steps.verify.outcome }}" = "failure" ]; then

            node .github/scripts/report.mjs \
              build_failed \
              "Derleme ya da derleme kontrolü başarısız."

          elif [ "${{ steps.live.outcome }}" = "failure" ]; then

            node .github/scripts/report.mjs \
              deploy_failed \
              "Dosyalar yüklendi ancak canlı site yeni sürümü göstermiyor."

          elif [ "${{ steps.deploy_ssh.outcome }}" = "failure" ] || \
               [ "${{ steps.deploy_ftps.outcome }}" = "failure" ]; then

            node .github/scripts/report.mjs \
              deploy_failed \
              "Sunucuya yükleme başarısız; eski site yayında."

          else
            node .github/scripts/report.mjs \
              build_failed \
              "Yayınlama hazırlığı başarısız."
          fi

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
