
name: Test FTPS Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Test secure FTPS login
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$FTP_USER" || {
            echo "::error::FTP_USER is empty"
            exit 1
          }

          test -n "$FTP_PASSWORD" || {
            echo "::error::FTP_PASSWORD is empty"
            exit 1
          }

          echo "77.245.159.39 codex.wisrv.com" | sudo tee -a /etc/hosts >/dev/null

          lftp -d -u "$FTP_USER,$FTP_PASSWORD" \
            -e '
              set ftp:ssl-force true
              set ftp:ssl-protect-data true
              set ssl:verify-certificate true
              set net:max-retries 1
              set net:timeout 15
              pwd
              cls
              bye
            ' \
            ftp://codex.wisrv.com
