
name: Test FTPS Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Test FTPS
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"

          echo "77.245.159.39 codex.wisrv.com" | sudo tee -a /etc/hosts >/dev/null

          # Avoid printing credentials in command logs.
          NETRC_FILE="$HOME/.netrc"
          trap 'rm -f "$NETRC_FILE"' EXIT

          printf 'machine codex.wisrv.com login %s password %s\n' \
            "$FTP_USER" "$FTP_PASSWORD" > "$NETRC_FILE"
          chmod 600 "$NETRC_FILE"

          lftp -e '
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set net:max-retries 2
            set net:timeout 20
            open ftp://codex.wisrv.com
            cls
            bye
          '
