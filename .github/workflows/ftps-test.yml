
name: Test FTPS Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Test secure FTPS connection
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP credentials are missing"
            exit 1
          fi

          # Match the FTP server's TLS certificate hostname.
          echo "77.245.159.39 codex.wisrv.com" | sudo tee -a /etc/hosts >/dev/null

          # Store credentials outside command-line arguments.
          # Do not print this file to the logs.
          CREDENTIALS_FILE="$(mktemp)"
          chmod 600 "$CREDENTIALS_FILE"
          trap 'rm -f "$CREDENTIALS_FILE"' EXIT

          printf 'user "%s" "%s"\n' \
            "$FTP_USER" "$FTP_PASSWORD" > "$CREDENTIALS_FILE"

          echo "Testing FTPS connection..."

          lftp -e "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set net:max-retries 1
            set net:timeout 20
            open ftp://codex.wisrv.com
            source $CREDENTIALS_FILE
            cls
            bye
          "

          echo "FTPS connection successful!"
